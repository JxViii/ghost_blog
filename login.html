<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>JxViii : Access</title>
  <link rel="icon" href="/icons/website.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <main class="login">
    <form class="login-card" id="login-form">
      <h1>Private <b>Access</b></h1>
      <p>These posts are only for people I've given access to. Enter the password I sent you.</p>

      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required autofocus>

      <p class="login-error" id="login-error" role="alert"></p>

      <button type="submit" id="login-submit">Unlock</button>
      <a class="login-back" href="/">← Back to the website</a>
    </form>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>

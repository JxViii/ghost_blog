[[redirects]]
  from = "/blog/post"
  to = "/blog/post.html"
  status = 200

[[headers]]
for = "/js/*"
[headers.values]
  Content-Type = "application/javascript"

[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"